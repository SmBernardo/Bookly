<div class="container-perfil">

    <header>
        <div class="logo-container" routerLink="/">
            <div class="logo"></div>
            <h1>Bookly</h1>
        </div>
        <button class="btn-voltar" routerLink="/">Voltar para Loja</button>
    </header>

    <main>
        <div class="profile-card" *ngIf="usuario">
            <div class="profile-header">
                <div class="avatar">
                    {{ usuario.nome.charAt(0).toUpperCase() }}
                </div>
                <h2>Minha Conta</h2>
            </div>

            <div class="profile-info">
                <div class="info-group">
                    <label>Nome Completo</label>
                    <div class="info-value">{{ usuario.nome }} {{ usuario.sobrenome }}</div>
                </div>

                <div class="info-group">
                    <label>E-mail</label>
                    <div class="info-value">{{ usuario.email }}</div>
                </div>

                </div>

            <div class="profile-actions">
                <button class="btn-acao btn-senha" (click)="alterarSenha()">Alterar Senha</button>
                <button class="btn-acao btn-logout" (click)="logout()">Sair da Conta</button>
                <button class="btn-acao btn-excluir" (click)="excluirConta()">Excluir Conta</button>
            </div>
        </div>
    </main>
</div>
