<div id="box">
        <main>
            <section id="login-section">
    <h1>Bem vindo de volta!</h1>
    <p>Basta fazer o login para continuar explorando.</p>

    <form [formGroup]="loginForm" (ngSubmit)="fazerLogin()">

      <div *ngIf="loginInvalido" class="error-message" style="text-align: center; margin-bottom: 10px;">
        E-mail ou senha inválidos.
      </div>
      
        <div id="login-box">
            <label for="email">
                Email
                <input type="email" id="email" placeholder="email@email.com" formControlName="email">
                <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.touched)">
                <span *ngIf="loginForm.get('email')?.errors?.['required']">Email é obrigatório.</span>
                <span *ngIf="loginForm.get('email')?.errors?.['email']">Formato de email inválido.</span>
            </div>
            </label>
            <label for="senha">
                Senha
                <div class="senha-container">
                    <input [type]="tipoInputSenha" id="senha" formControlName="senha">
                    <div id="visualizar" (click)="toggleSenha()" [class.visivel]="senhaVisivel"></div>
                </div>
            </label>
            <div *ngIf="loginForm.get('senha')?.invalid && (loginForm.get('senha')?.touched)">
                Senha é obrigatória.
            </div>
        </div>

        <p style="margin-top: 15px;" id="conta-1">Não possui uma conta? <a routerLink="/cadastro">Criar</a></p>

        <div id="mobile-login-button">
            <button id="login-button-1" type="submit">Login</button>
        </div>

    </form> </section>
            <section id="image-section">

                <section id="animação_logi">
                    <div id="box_de_cima"></div>
                    <div id="circulo_oco"></div>
                    <div id="gota_de_cima"></div>
                    <div id="gota_do_meio"></div>
                    <div id="pontilhado"></div>
                    <div id="circulo_esquerdo"></div>
                    <div id="gota_de_baixo"></div>
                    <div id="circulo_direito"></div>
                    <div id="box_de_baixo"></div>
                </section>

                <div class="logo-box"></div>
                <h2 id="bookly">bookly</h2>
            </section>
        </main>
    </div>
