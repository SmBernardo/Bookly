<div id="box">
    <main>
        <section id="image-section">
            <div class="logo-box"></div>
            <h2>bookly</h2>
        </section>

        <section id="login-section">
            <h1>Bem vindo ao Bookly!</h1>
            <p>Para começar a explorar o nosso catálogo é preciso se cadastrar.</p>

            <form [formGroup]="cadastroForm" (ngSubmit)="criarConta()">

                <div id="login">
                    <div class="label-container">
                        <label for="nome">
                            Nome
                            <input type="text" id="nome" class="inp" formControlName="nome">
                            <div *ngIf="cadastroForm.get('nome')?.invalid && (cadastroForm.get('nome')?.touched || cadastroForm.get('nome')?.dirty)" class="error-message">
                                Nome é obrigatório.
                            </div>
                        </label>
                        <label for="sobrenome">
                            Sobrenome
                            <input type="text" id="sobrenome" class="inp" formControlName="sobrenome">
                        </label>
                    </div>
                    <label for="email" id="label-email">
                        Email
                        <input type="email" id="email" class="inp" placeholder="email@email.com" formControlName="email">
                        <div *ngIf="cadastroForm.get('email')?.invalid && (cadastroForm.get('email')?.touched || cadastroForm.get('email')?.dirty)" class="error-message">
                            <span *ngIf="cadastroForm.get('email')?.errors?.['required']">Email é obrigatório.</span>
                            <span *ngIf="cadastroForm.get('email')?.errors?.['email']">Formato de email inválido.</span>
                        </div>
                    </label>
                    <div class="label-container">
                        <label for="senha">
                            Senha
                            <div class="senha-container">
                                <input [type]="tipoInputSenha" id="senha" class="inp" formControlName="senha">
                                <div id="visualizar" (click)="toggleSenha()" [class.visivel]="senhaVisivel"></div>
                            </div>
                             <div *ngIf="cadastroForm.get('senha')?.invalid && (cadastroForm.get('senha')?.touched || cadastroForm.get('senha')?.dirty)" class="error-message">
                                <span *ngIf="cadastroForm.get('senha')?.errors?.['required']">Senha é obrigatória.</span>
                                <span *ngIf="cadastroForm.get('senha')?.errors?.['minlength']">A senha precisa ter no mínimo 6 caracteres.</span>
                            </div>
                        </label>

                        <label for="confirmar" id="label-confirmar">
                            Confirmar senha
                            <div class="senha-container">
                                <input [type]="tipoInputSenhaConfirmar" id="confirmar" class="inp" formControlName="confirmarSenha">
                                <div id="visualizar-confirmar" (click)="toggleSenhaConfirmar()" [class.visivel]="senhaVisivelConfirmar"></div>
                            </div>
                            <div *ngIf="cadastroForm.get('confirmarSenha')?.invalid && cadastroForm.get('confirmarSenha')?.touched" class="error-message">
                                <span *ngIf="cadastroForm.get('confirmarSenha')?.errors?.['required']">Confirmação é obrigatória.</span>
                            </div>
                            <div *ngIf="cadastroForm.errors?.['passwordMismatch'] && cadastroForm.get('confirmarSenha')?.touched" class="error-message">
                                As senhas não conferem.
                            </div>
                        </label>
                    </div>

                    <label for="termos" id="label-termos">
                        <input type="checkbox" id="termos" formControlName="termos">
                        Eu li e concordo com os termos de uso.
                    </label>

                    <div *ngIf="cadastroForm.get('termos')?.invalid && (cadastroForm.get('termos')?.touched || cadastroForm.get('termos')?.dirty)" class="error-message">
                        Você deve aceitar os termos de uso para continuar.
                    </div>
                    </div>

                <button id="criar" type="submit" [disabled]="cadastroForm.invalid">Criar conta</button>

            </form>
            <p style="margin-top: 15px;">Já possui uma conta? <a routerLink="/login">Entre</a></p>

        </section>
    </main>
</div>
