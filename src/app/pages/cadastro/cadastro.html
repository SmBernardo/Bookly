<section id="login-section">
    <h1>Bem vindo ao Bookly!</h1>
    <p>Para começar a explorar o nosso catálogo é preciso se cadastrar.</p>

    <form [formGroup]="cadastroForm" (ngSubmit)="criarConta()">

        <div id="login">
            <div class="label-container">
                <label for="nome">
                    Nome
                    <input type="text" id="nome" class="inp" formControlName="nome">
                    <div *ngIf="cadastroForm.get('nome')?.invalid && (cadastroForm.get('nome')?.touched || cadastroForm.get('nome')?.dirty)">
                      Nome é obrigatório.
                      </div>
                </label>
                <label for="sobrenome">
                    Sobrenome
                    <input type="text" id="sobrenome" class="inp" formControlName="sobrenome">
                </label>
            </div>
            <label for="email" id="label-email">
                Email
                <input type="email" id="email" class="inp" placeholder="email@email.com" formControlName="email">
                <div *ngIf="cadastroForm.get('email')?.invalid && (cadastroForm.get('email')?.touched || cadastroForm.get('email')?.dirty)">
    <span *ngIf="cadastroForm.get('email')?.errors?.['required']">Email é obrigatório.</span>
    <span *ngIf="cadastroForm.get('email')?.errors?.['email']">Formato de email inválido.</span>
</div>
            </label>
            <div class="label-container">
                <label for="senha">
                    Senha
                    <input [type]="tipoInputSenha" id="senha" class="inp" formControlName="senha">
                    <div id="visualizar" (click)="toggleSenha()" [class.visivel]="senhaVisivel"></div>
                </label>
                <label for="confirmar" id="label-confirmar">
                    Confirmar senha
                    <input type="password" id="confirmar" class="inp">
                </label>
            </div>
            <label for="termos" id="label-termos">
                <input type="checkbox" name="termos" id="termos">
                Eu li e concordo com os termos de uso.
            </label>
        </div>

        <button id="criar" type="submit">Criar conta</button>

    </form> <p style="margin-top: 15px;">Já possui uma conta? <a routerLink="/login">Entre</a></p>

    <style>
      div[ngIf] {
        color: red;
        font-size: 0.8em;
        margin-top: 5px;
        }
    </style>

</section>
